name: Publish

# This repository is the public mirror of symify. The export in the internal
# repository pushes one commit and one annotated tag for each release, with the
# release notes in the tag's message, and the tag starts this workflow. It
# builds the binaries from the exported tree, publishes the crates to
# crates.io and the packages to npm, and creates the GitHub release. The
# internal repository ran the tests before the export, so this workflow runs
# none.

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

# Two releases never run at once, and a release in progress is never
# cancelled, because a publish that stops halfway is the worst outcome.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # 1. Check that the tag agrees with the tree. The fast checks run first, so
  #    a typo in the tag fails the release in seconds.
  # ---------------------------------------------------------------------------
  meta:
    name: verify tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      npm_tag: ${{ steps.v.outputs.npm_tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Derive the version from the tag
        id: v
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # A semver prerelease version has a hyphen after the patch number.
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "npm_tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "npm_tag=latest" >> "$GITHUB_OUTPUT"
          fi
          echo "Releasing $version"

      - name: Tag matches every version in the tree
        run: node scripts/verify-version.mjs "${{ steps.v.outputs.version }}"

      # The export writes the release notes into the tag's message. A tag
      # without notes didn't come from the export.
      - name: The tag carries the release notes
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          if [ "$(git cat-file -t "$GITHUB_REF_NAME")" != tag ]; then
            echo "::error::$GITHUB_REF_NAME is no annotated tag, so it has no release notes"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # 2. Build the binary for each platform.
  # ---------------------------------------------------------------------------
  build:
    name: build ${{ matrix.pkg }}
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Linux binaries link musl statically, so they need no minimum
          # glibc version and they also run on Alpine. zigbuild supplies the C
          # cross-compiler that blake3's NEON code needs, which plain rust-lld
          # can't build for aarch64 musl.
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, pkg: linux-x64, builder: zigbuild }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl, pkg: linux-arm64, builder: zigbuild }
          - { os: macos-latest, target: x86_64-apple-darwin, pkg: darwin-x64, builder: cargo }
          - { os: macos-latest, target: aarch64-apple-darwin, pkg: darwin-arm64, builder: cargo }
          # The Windows binary is built natively on a Windows runner, where msvc
          # needs no cross-compilation setup. The release builds only the x64 binary,
          # because Windows on ARM runs it under emulation, and we never ship a
          # binary that CI hasn't run.
          - { os: windows-latest, target: x86_64-pc-windows-msvc, pkg: win32-x64, builder: cargo }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # rust-toolchain.toml sets the Rust version. This step adds only the
      # cross-compilation target, because the target belongs to the matrix entry,
      # not to the toolchain.
      - name: Install the pinned toolchain and cross target
        run: |
          rustup toolchain install --profile minimal
          rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-zigbuild
        if: matrix.builder == 'zigbuild'
        uses: taiki-e/install-action@v2.85.6
        with:
          tool: cargo-zigbuild

      # This step reads the zig version from .mise.toml, so CI and local
      # development cross-compile with the same zig. Without it, the action
      # would use the latest zig.
      - name: Read the pinned zig version
        if: matrix.builder == 'zigbuild'
        id: zig
        run: |
          version="$(grep -oE '^zig = "[^"]+"' .mise.toml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')"
          if [ -z "$version" ]; then
            echo "::error::could not read the zig version from .mise.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "zig $version"

      # setup-zig must be v2 or later. Zig 0.15 renamed its tarballs from
      # zig-<os>-<arch>-<ver> to zig-<arch>-<os>-<ver>, but v1 still builds the
      # old URL, so every mirror returns 404.
      - name: Install zig
        if: matrix.builder == 'zigbuild'
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ steps.zig.outputs.version }}
          cache-key: ${{ matrix.target }}

      - name: Build (zigbuild)
        if: matrix.builder == 'zigbuild'
        run: cargo zigbuild --release --locked --target ${{ matrix.target }} -p symify

      - name: Build (cargo)
        if: matrix.builder == 'cargo'
        run: cargo build --release --locked --target ${{ matrix.target }} -p symify

      - name: Stage the binary into its platform package
        shell: bash
        run: |
          bin="symify"
          case "${{ matrix.target }}" in *windows*) bin="symify.exe" ;; esac
          install -m 0755 "target/${{ matrix.target }}/release/$bin" \
            "packages/symify-${{ matrix.pkg }}/bin/$bin"

      - name: Assert Linux binaries are statically linked
        if: matrix.builder == 'zigbuild'
        run: |
          bin="packages/symify-${{ matrix.pkg }}/bin/symify"
          if readelf -l "$bin" | grep -q "program interpreter"; then
            echo "::error::$bin is dynamically linked, but it should be a static musl build"
            readelf -l "$bin" | grep "program interpreter"
            exit 1
          fi
          echo "$bin is static"

      # When the runner can execute the binary built for its target, this step
      # runs it and checks its output, its JSON, and its exit codes. The aarch64
      # musl binary can't run on the x64 Ubuntu runner. The darwin-x64 binary
      # runs on the arm64 runner through Rosetta.
      - name: Smoke-test the release binary
        if: matrix.pkg != 'linux-arm64'
        shell: bash
        run: |
          bin="packages/symify-${{ matrix.pkg }}/bin/symify"
          case "${{ matrix.target }}" in *windows*) bin="$bin.exe" ;; esac
          node scripts/release-smoke.mjs "$bin"

      # This step packs the launcher and this platform package with npm pack,
      # then runs the built binary through the launcher. The launcher chooses
      # the package by the platform and architecture of the host, so the step
      # runs only where the built package matches the runner.
      - name: Smoke-test the npm launcher with the packed binary
        if: matrix.pkg == 'linux-x64' || matrix.pkg == 'darwin-arm64' || matrix.pkg == 'win32-x64'
        shell: bash
        run: node scripts/launcher-smoke.mjs

      - uses: actions/upload-artifact@v7
        with:
          name: symify-${{ matrix.pkg }}
          path: packages/symify-${{ matrix.pkg }}/bin/symify*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 3. Publish. Nothing here runs until the tag and the builds agree.
  # ---------------------------------------------------------------------------
  publish:
    name: publish
    needs: [meta, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The OpenID Connect token signs the npm provenance, and authenticates
      # trusted publishing on crates.io and npm.
      id-token: write
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      NPM_TAG: ${{ needs.meta.outputs.npm_tag }}
      # The first publish of a name needs a token, because trusted publishing
      # can be set up only for a name that exists. After the first publish,
      # both secrets are deleted, and the job uses trusted publishing.
      HAS_CARGO_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install the pinned toolchain
        run: rustup toolchain install --profile minimal

      - name: Download platform binaries
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Place the binaries into their platform packages
        run: |
          for pkg in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            install -m 0755 "artifacts/symify-$pkg/symify" "packages/symify-$pkg/bin/symify"
          done
          install -m 0755 "artifacts/symify-win32-x64/symify.exe" \
            "packages/symify-win32-x64/bin/symify.exe"

      - name: Smoke-test the built binary
        run: |
          actual="$(./packages/symify-linux-x64/bin/symify --version)"
          expected="symify $VERSION"
          if [ "$actual" != "$expected" ]; then
            echo "::error::the binary reports '$actual', but the release expects '$expected'"
            exit 1
          fi
          echo "$actual"

      # A crate or a package whose version is already on its registry is
      # left out, as the publish steps skip it, because a dry run refuses a
      # published version too, and a run again after a half-failed release
      # would stop here.
      - name: Dry-run every publish before doing any of them
        run: |
          exclude=""
          for crate in symify-core symify; do
            status="$(curl -s -o /dev/null -w '%{http_code}' -A 'symify-publish (github.com/six5536/symify)' \
              "https://crates.io/api/v1/crates/$crate/$VERSION")"
            if [ "$status" = 200 ]; then exclude="$exclude --exclude $crate"; fi
          done
          if [ "$(echo $exclude | wc -w)" -lt 4 ]; then
            cargo publish --workspace --locked --dry-run $exclude
          fi
          for dir in packages/symify-linux-x64 packages/symify-linux-arm64 packages/symify-darwin-x64 \
                     packages/symify-darwin-arm64 packages/symify-win32-x64 packages/symify; do
            name="$(node -p "require('./$dir/package.json').name")"
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "$name@$VERSION is already published"
            else
              npm publish "./$dir" --dry-run --tag "$NPM_TAG"
            fi
          done

      - name: Authenticate to crates.io with trusted publishing
        if: env.HAS_CARGO_TOKEN != 'true'
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@v1

      # The crates go in the order of their dependencies, and cargo waits until
      # each one is in the index before the next one needs it. A crate whose
      # version is already on crates.io is skipped, so a run again after a
      # half-failed release publishes only what is missing.
      - name: Publish the crates to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || steps.crates-auth.outputs.token }}
        run: |
          for crate in symify-core symify; do
            status="$(curl -s -o /dev/null -w '%{http_code}' -A 'symify-publish (github.com/six5536/symify)' \
              "https://crates.io/api/v1/crates/$crate/$VERSION")"
            if [ "$status" = 200 ]; then
              echo "$crate $VERSION is already published"
              continue
            fi
            cargo publish --locked -p "$crate"
          done

      # The platform packages go before the launcher, because the launcher
      # declares them as optionalDependencies. If the launcher went first, it
      # would briefly point users at versions that don't exist yet. A package
      # whose version is already on npm is skipped.
      - name: Publish the packages to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for dir in packages/symify-linux-x64 packages/symify-linux-arm64 packages/symify-darwin-x64 \
                     packages/symify-darwin-arm64 packages/symify-win32-x64 packages/symify; do
            name="$(node -p "require('./$dir/package.json').name")"
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "$name@$VERSION is already published"
              continue
            fi
            npm publish "./$dir" --tag "$NPM_TAG"
          done

  # ---------------------------------------------------------------------------
  # 4. Create the GitHub release, with its archives, checksums, and notes.
  # ---------------------------------------------------------------------------
  github-release:
    name: github release
    needs: [meta, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned toolchain
        run: rustup toolchain install --profile minimal

      - name: Download platform binaries
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Generate man page and completions
        run: |
          mkdir -p dist/share
          cargo build --release --locked -p symify
          ./target/release/symify man > dist/share/symify.1
          for shell in bash zsh fish powershell elvish; do
            ./target/release/symify completions "$shell" > "dist/share/symify.$shell"
          done

      - name: Build archives and checksums
        run: |
          mkdir -p dist/out
          for pkg in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            stage="dist/stage/symify-$VERSION-$pkg"
            mkdir -p "$stage"
            install -m 0755 "artifacts/symify-$pkg/symify" "$stage/symify"
            cp README.md LICENSE "$stage/"
            cp -r dist/share "$stage/share"
            tar -czf "dist/out/symify-$VERSION-$pkg.tar.gz" -C dist/stage "symify-$VERSION-$pkg"
          done
          # The Windows binary ships in a .zip, the archive format that Windows
          # users expect.
          stage="dist/stage/symify-$VERSION-win32-x64"
          mkdir -p "$stage"
          install -m 0755 "artifacts/symify-win32-x64/symify.exe" "$stage/symify.exe"
          cp README.md LICENSE "$stage/"
          cp -r dist/share "$stage/share"
          (cd dist/stage && zip -qr "../out/symify-$VERSION-win32-x64.zip" "symify-$VERSION-win32-x64")
          cd dist/out && sha256sum ./*.tar.gz ./*.zip > SHA256SUMS && cat SHA256SUMS

      # The notes are the body of the tag's message, which the export wrote
      # with git-cliff from the commits of the release.
      - name: Read the release notes from the tag
        run: |
          git fetch --force origin "refs/tags/v${VERSION}:refs/tags/v${VERSION}"
          git for-each-ref "refs/tags/v${VERSION}" --format='%(contents:body)' > dist/notes.md
          if [ ! -s dist/notes.md ]; then
            echo "::error::the tag v${VERSION} carries no release notes"
            exit 1
          fi
          cat dist/notes.md

      - name: Create the release
        uses: softprops/action-gh-release@v3
        with:
          name: v${{ env.VERSION }}
          body_path: dist/notes.md
          prerelease: ${{ needs.meta.outputs.prerelease == 'true' }}
          files: |
            dist/out/*.tar.gz
            dist/out/*.zip
            dist/out/SHA256SUMS
