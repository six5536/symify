[package]
name = "symify"
description = "Keep your files in sync with a backing repository — as symlinks or copies."
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
readme.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "symify"
path = "src/main.rs"

[lints.rust]
# `coverage_nightly` is set by cargo-llvm-cov under the nightly coverage job; it
# is an expected cfg, not a typo, on every other toolchain.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)'] }

[dependencies]
symify-core.workspace = true
clap = { workspace = true }
clap_complete = { workspace = true }
clap_mangen = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
similar = "3.1.2"

[dev-dependencies]
assert_cmd = { workspace = true }
insta = { workspace = true }
tempfile = { workspace = true }
serde_json = { workspace = true }
