[workspace]
resolver = "2"
members = [
  "crates/app/*",
  "crates/lib/*",
]
# Without this a bare `cargo build` fails with "the workspace has no members".
default-members = ["crates/app/symify", "crates/lib/symify-core"]

[workspace.package]
version = "0.1.0-rc.1"
authors = ["six5536 <10079653+six5536@users.noreply.github.com>"]
edition = "2024"
rust-version = "1.96.0"
readme = "README.md"
license = "MIT"
repository = "https://github.com/six5536/symify"
homepage = "https://github.com/six5536/symify"
keywords = ["dotfiles", "symlink", "cli", "config"]
categories = ["command-line-utilities", "filesystem"]

[workspace.dependencies]
# External dependencies (alphabetical)
blake3 = "1.8"
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"
clap_mangen = "0.3"
directories = "6.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
toml = "1.1"
toml_edit = "0.25"

# Dev dependencies
assert_cmd = "2.2"
insta = "1.47"
tempfile = "3.27"

# Internal crates
symify-core = { path = "crates/lib/symify-core", version = "0.1.0-rc.1" }

# Optimize release builds for size
[profile.release]
opt-level = "z"  # optimize aggressively for size
strip = true  # strip debug info and symbols
lto = true  # full link-time optimization across all crates
panic = "abort"  # no unwinding overhead
codegen-units = 1  # single codegen unit → better optimization

[profile.test]
opt-level = 0
debug = 0
split-debuginfo = "unpacked"  # For macOS
